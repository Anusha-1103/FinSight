<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#121212"/>
  <rect x="40" y="40" width="1120" height="550" rx="40" fill="#1C1C1E" stroke="rgba(255,255,255,0.06)" stroke-width="2"/>
  
  <!-- Evolved Polaris Horizon Mark Symbol -->
  <g transform="translate(100, 100)">
    <rect width="120" height="120" rx="28" fill="#121212" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
    <g transform="translate(60, 60) scale(0.35)">
      <path d="M 0 -150 L 26 0 L 0 150 L -26 0 Z" fill="#C5A059"/>
      <path d="M -140 20 C -70 -70 70 -70 140 20" fill="none" stroke="#4A7C59" stroke-width="28" stroke-linecap="round"/>
      <path d="M 0 35 L 75 35 L 60 62 L 0 62 Z" fill="#C5A059"/>
      <polygon points="0,-30 30,0 0,30 -30,0" fill="#FBF9F5"/>
    </g>
  </g>

  <!-- Headline Typography -->
  <text x="100" y="290" font-family="Georgia, serif" font-size="72" fill="#FBF9F5" letter-spacing="-2">FinSight AI</text>
  <text x="100" y="350" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" fill="#A1A1AA" font-weight="400">Navigating Your Personal Wealth Journey</text>
  
  <!-- Feature Badges -->
  <g transform="translate(100, 420)">
    <rect x="0" y="0" width="230" height="48" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="115" y="29" font-family="sans-serif" font-size="15" font-weight="500" fill="#C5A059" text-anchor="middle">Financial Health Index</text>
    
    <rect x="250" y="0" width="220" height="48" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="360" y="29" font-family="sans-serif" font-size="15" font-weight="500" fill="#4A7C59" text-anchor="middle">Gemini Vision OCR</text>
    
    <rect x="490" y="0" width="220" height="48" rx="24" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
    <text x="600" y="29" font-family="sans-serif" font-size="15" font-weight="500" fill="#FBF9F5" text-anchor="middle">Command Palette</text>
  </g>

  <text x="100" y="530" font-family="monospace" font-size="16" fill="#71717A">finsight.ai • Open-Source Wealth Intelligence</text>
</svg>
