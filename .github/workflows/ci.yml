name: FinSight AI Production CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-test:
    name: Backend Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: npm ci
        working-directory: ./server

      - name: Generate Prisma Client
        run: npx prisma generate
        working-directory: ./server

      - name: TypeScript Build Check
        run: npm run build
        working-directory: ./server

      - name: Run Jest Test Suite
        run: npm test
        working-directory: ./server
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret_32bytes_long_string
          REFRESH_TOKEN_SECRET: test_refresh_token_secret_32bytes

  frontend-build:
    name: Frontend Vite Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci
        working-directory: ./client

      - name: TypeScript & Vite Build Check
        run: npm run build
        working-directory: ./client
